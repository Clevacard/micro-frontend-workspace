   <div class="shell-dashboard">
<h1 style="color: rgb(0, 153, 255);">Micro App 3</h1>
  <h2 style="color: green;">✅ Custom Library Dynamic form implemented in MicroApp1 can be utilized across all micro frontends!</h2>
  <div style="padding:20px;">
      <h2>Micro App 2 (Receiver)</h2>
      <p><strong>Received message:</strong> {{ receivedMessage }}</p>
    </div>
  <ng-container #vc></ng-container>
    <lib-dynamic-form
      [form]="myForm"
      [formFields]="fields"
    ></lib-dynamic-form>
   </div>
   <h2>Micro-frontend B</h2>
    <p>Items in cart: {{ cartItems?.length }}</p>
    <ul>
      <li *ngFor="let item of cartItems">
        {{ item?.name }} (ID: {{ item?.id }})
      </li>
    </ul>
